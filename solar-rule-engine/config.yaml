location:
  latitude: -27.7
  longitude: 28.43
  timezone: "Africa/Johannesburg"

panels:
  total_kwp: 5.5
  tilt: 26
  azimuth: -5

battery:
  capacity_kwh: 14.4
  min_soc: 40
  max_soc: 100

mqtt:
  host: "localhost"
  port: 1883
  username: ""
  password: ""
  inverter_id: "inverter_1"

weather_source: "mariadb"

mariadb:
  host: "localhost"
  port: 3306
  database: "wattcast"
  user: "wattcast"
  password: "Sarferfrika#0815!"

engine:
  eval_interval_seconds: 300
  forecast_refresh_minutes: 60
  preset_cooldown_minutes: 30
  dry_run: true
  log_level: "INFO"

presets:
  default:
    description: "Balanced winter — protects overnight, frees up during solar hours"
    slots:
      - time: "00:00"
        capacity: 55
        grid_charge: true
      - time: "07:00"
        capacity: 40
        grid_charge: true
      - time: "13:00"
        capacity: 40
        grid_charge: true
      - time: "18:00"
        capacity: 60
        grid_charge: true
      - time: "18:00"
        capacity: 60
        grid_charge: false
      - time: "18:00"
        capacity: 60
        grid_charge: false

  summer_good:
    description: "Good solar day — low floors, let solar fill the battery"
    slots:
      - time: "00:00"
        capacity: 40
        grid_charge: true
      - time: "07:00"
        capacity: 40
        grid_charge: true
      - time: "13:00"
        capacity: 40
        grid_charge: true
      - time: "18:00"
        capacity: 50
        grid_charge: true
      - time: "18:00"
        capacity: 50
        grid_charge: false
      - time: "18:00"
        capacity: 50
        grid_charge: false

  winter_mixed:
    description: "Mixed forecast — moderate protection"
    slots:
      - time: "00:00"
        capacity: 60
        grid_charge: true
      - time: "07:00"
        capacity: 50
        grid_charge: true
      - time: "13:00"
        capacity: 40
        grid_charge: true
      - time: "18:00"
        capacity: 65
        grid_charge: true
      - time: "18:00"
        capacity: 65
        grid_charge: false
      - time: "18:00"
        capacity: 65
        grid_charge: false

  storm_protection:
    description: "Poor forecast or active rain — protect battery"
    slots:
      - time: "00:00"
        capacity: 70
        grid_charge: true
      - time: "07:00"
        capacity: 60
        grid_charge: true
      - time: "13:00"
        capacity: 55
        grid_charge: true
      - time: "18:00"
        capacity: 75
        grid_charge: true
      - time: "18:00"
        capacity: 75
        grid_charge: false
      - time: "18:00"
        capacity: 75
        grid_charge: false

rules:
  - name: "Storm Protection"
    priority: 10
    preset: storm_protection
    conditions:
      any:
        - all:
            - field: rain_rate
              op: ">"
              value: 2.0
        - all:
            - field: rain_probability_tomorrow
              op: ">"
              value: 70
            - field: forecast_tomorrow_kwh
              op: "<"
              value: 5.0

  - name: "Good Solar Day"
    priority: 20
    preset: summer_good
    conditions:
      any:
        - all:
            - field: forecast_tomorrow_kwh
              op: ">"
              value: 8.5
            - field: rain_probability_tomorrow
              op: "<"
              value: 30

  - name: "Mixed Day"
    priority: 30
    preset: winter_mixed
    conditions:
      any:
        - all:
            - field: forecast_tomorrow_kwh
              op: ">="
              value: 3.0
            - field: forecast_tomorrow_kwh
              op: "<"
              value: 8.5

  - name: "Default"
    priority: 999
    preset: default
    default: true
    conditions:
      any: []
